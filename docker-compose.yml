services:
  service-registry:
    build:
      context: .
      dockerfile: service-registry/Dockerfile
    ports: ["8761:8761"]
    environment:
      SERVER_PORT: 8761
      INSTANCE_TTL: 10s
  payment-service-1:
    build:
      context: .
      dockerfile: service-provider/Dockerfile
    ports: ["8081:8081"]
    environment:
      SERVER_PORT: 8081
      SERVICE_NAME: payment-service
      INSTANCE_ID: payment-service-8081
      SERVICE_HOST: payment-service-1
      REGISTRY_URL: http://service-registry:8761
      HEARTBEAT_INTERVAL: 3s
    depends_on: [service-registry]
    restart: on-failure
  payment-service-2:
    build:
      context: .
      dockerfile: service-provider/Dockerfile
    ports: ["8082:8082"]
    environment:
      SERVER_PORT: 8082
      SERVICE_NAME: payment-service
      INSTANCE_ID: payment-service-8082
      SERVICE_HOST: payment-service-2
      REGISTRY_URL: http://service-registry:8761
      HEARTBEAT_INTERVAL: 3s
    depends_on: [service-registry]
    restart: on-failure
  payment-service-3:
    build:
      context: .
      dockerfile: service-provider/Dockerfile
    ports: ["8083:8083"]
    environment:
      SERVER_PORT: 8083
      SERVICE_NAME: payment-service
      INSTANCE_ID: payment-service-8083
      SERVICE_HOST: payment-service-3
      REGISTRY_URL: http://service-registry:8761
      HEARTBEAT_INTERVAL: 3s
    depends_on: [service-registry]
    restart: on-failure
  service-consumer:
    build:
      context: .
      dockerfile: service-consumer/Dockerfile
    ports: ["8080:8080"]
    environment:
      SERVER_PORT: 8080
      SERVICE_NAME: payment-service
      REGISTRY_URL: http://service-registry:8761
    depends_on: [service-registry, payment-service-1, payment-service-2, payment-service-3]
    restart: on-failure
